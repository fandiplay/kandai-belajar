<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belajar AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
*{box-sizing:border-box;min-width:0}html{max-width:100%;overflow-x:hidden}body{margin:0;font-family:system-ui,sans-serif;background:#fdfcfa;color:#0d1520;width:100%;max-width:520px;overflow-x:hidden;margin-left:auto;margin-right:auto;padding:16px}
.card{border:2px solid #d8d3c8;border-radius:20px;padding:16px;margin:12px 0;background:#fff;max-width:100%;min-width:0;overflow-wrap:anywhere}.c{text-align:center}
.btn,.opt{display:block;width:100%;padding:14px;border-radius:14px;border:2px solid #0d1520;background:#0d1520;color:#fff;font-size:16px;font-weight:600;margin:10px 0;box-shadow:0 4px 0 #000}
.opt{background:#fff;color:#0d1520;text-align:left;font-weight:400;box-shadow:0 3px 0 #0d1520;width:100%;max-width:100%;box-sizing:border-box;height:auto;min-height:56px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;padding:14px 16px;line-height:1.5;overflow:visible}.opt .katex{font-size:1em;white-space:normal;max-width:100%;width:auto;min-width:0}.opt .katex-html{white-space:normal;max-width:100%}.opt .katex-display{max-width:100%;overflow-x:auto;font-size:.9em}.ok{background:#c9f2d0!important}.no{background:#f6c9c9!important}
.btn.sec{background:#fff;color:#0d1520}input,textarea{width:100%;padding:12px;border:2px solid #d8d3c8;border-radius:12px;font-size:16px;margin:6px 0}
.top{display:flex;gap:12px;align-items:center}.x{border:0;background:none;font-size:22px}.bar{flex:1;height:10px;background:#e6e2d9;border-radius:9px}.bar i{display:block;height:100%;background:#a79bf7;border-radius:9px}
.unit{margin:22px 0 4px;font-weight:700;color:#555}.node{display:flex;align-items:center;gap:14px;margin:14px 0}
.dot{width:64px;height:64px;border-radius:50%;border:3px solid #0d1520;background:#fff;font-size:22px;box-shadow:0 5px 0 #0d1520}
.dot.done{background:#0d1520;color:#fff;box-shadow:0 5px 0 #a79bf7}.dot.lock{background:#f1eee8;border-color:#d8d3c8;box-shadow:none;color:#aaa}
.fb{padding:10px 0}.link{color:#555;text-decoration:underline;cursor:pointer}pre{overflow:auto}

.spacer{height:180px;pointer-events:none;flex-shrink:0;display:block}
.math-block{overflow-x:auto;max-width:100%;min-width:0;text-align:center;margin:12px 0;font-size:.9em}
.katex{font-size:1.1em}
/* Navigasi pelajaran + tutor kucing */
body{padding-bottom:112px}
.lesson-dots{display:flex;align-items:center;justify-content:center;gap:6px;min-height:16px;margin:12px 0 18px}
.lesson-dot{height:7px;width:7px;border-radius:99px;background:#d8d8df;transition:width .2s,background .2s}
.lesson-dot.active{width:25px;background:#a79bf7}
.lesson-nav{position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),488px);display:flex;gap:10px;padding:8px;background:#fdfcfa;border:2px solid #0d1520;border-radius:18px;box-shadow:0 4px 0 #0d1520}
.lesson-nav button{margin:0;box-shadow:none;height:52px}
.lesson-prev{width:58px;flex:0 0 58px;font-size:24px!important;padding:8px!important}
.lesson-next{flex:1}
.lesson-nav button:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
#bd,#fb,.lesson-nav{box-sizing:border-box;max-width:100%;min-width:0}
#bd,#fb{overflow-wrap:anywhere}
#bd .katex,#fb .katex,.ask-answer .katex{max-width:100%}
#bd .katex-display,#fb .katex-display,.ask-answer .katex-display{max-width:100%;overflow-x:auto;font-size:.9em}
#bd p,#bd li,#fb p,#fb li,.ask-answer p,.ask-answer li{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
#app{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
.lesson-nav{width:min(calc(100% - 32px),488px)}

.cat-bubble{position:fixed;z-index:21;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:88px;width:110px;height:70px;padding:4px;border:2px solid #0d1520;border-radius:15px;background:#fff;box-shadow:0 3px 0 #0d1520;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:catWiggle 4s ease-in-out infinite;transform-origin:75% 100%}
.cat-bubble svg{width:100%;height:100%}
@keyframes catWiggle{0%,88%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}92%{transform:rotate(4deg)}94%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}98%{transform:rotate(0)}}
.cat-bubble.shake{animation:catNudge .42s ease-in-out}
@keyframes catNudge{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.ask-overlay{position:fixed;z-index:40;inset:0;background:#0d152077;display:flex;align-items:flex-end;justify-content:center}
.ask-sheet{width:min(100%,520px);max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:2px solid #0d1520;border-bottom:0;border-radius:24px 24px 0 0;padding:14px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -5px 0 #0d1520;min-height:0}
.ask-head{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-bottom:10px;border-bottom:2px solid #d8d3c8}.ask-head h3{flex:1;margin:0;font-size:18px}.ask-close{border:2px solid #0d1520;border-radius:10px;background:#fff;font-size:22px;width:40px;height:40px;flex-shrink:0}
.ask-clear{border:1.5px solid #0d1520;background:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:700;color:#0d1520}
.ask-subtitle{margin:8px 0;color:#555;font-size:12px;flex-shrink:0}
.ask-messages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 2px 12px;display:flex;flex-direction:column;gap:12px}
.ask-message{max-width:88%;min-width:0;border:2px solid #0d1520;border-radius:15px;padding:9px 11px;overflow-wrap:anywhere;word-break:break-word;line-height:1.5;flex-shrink:0}
.ask-message.user{align-self:flex-end;background:#0d1520;color:#fff;border-bottom-right-radius:5px}
.ask-message.assistant{align-self:flex-start;background:#fff;color:#0d1520;border-bottom-left-radius:5px}
.ask-message.error{border-color:#b3261e;background:#fff8f7;color:#7f1d1d}
.ask-label{font-size:10px;font-weight:800;letter-spacing:.02em;opacity:.72;margin-bottom:4px}
.ask-message p{margin:5px 0}.ask-message p:first-child{margin-top:0}.ask-message p:last-child{margin-bottom:0}
.ask-message .katex{max-width:100%}.ask-message .katex-display,.ask-message .math-block{max-width:100%;overflow-x:auto;font-size:.9em}
.ask-composer{display:flex;gap:8px;align-items:flex-end;flex-shrink:0;padding-top:10px;border-top:2px solid #d8d3c8;background:#fff}
.ask-composer textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:112px;margin:0;padding:10px;border:2px solid #d8d3c8;border-radius:12px;font-size:16px;line-height:1.4;overflow-y:auto}
.ask-send{width:auto;min-width:84px;margin:0;padding:12px 10px;box-shadow:0 3px 0 #000;align-self:stretch}
.ask-send:disabled{opacity:.55}
.ask-thinking{opacity:.7;font-style:italic}
.ask-retry{margin-top:7px;border:1px solid #7f1d1d;background:#fff;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;color:#7f1d1d}
@supports(height:100dvh){.ask-sheet{max-height:85dvh}}
.stats{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-shrink:0;font-size:14px;font-weight:750;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:3px}
.stat-flame.inactive{opacity:.32;filter:grayscale(1)}
.xp-pop{display:inline-block;margin-left:8px;color:#6b55d9;font-size:13px;font-weight:800;animation:xpPop 1.2s ease-out both}
@keyframes xpPop{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(-5px)}100%{opacity:0;transform:translateY(-13px)}}
.streak-pop{display:inline-block;animation:streakPop .6s ease-out}
@keyframes streakPop{0%{transform:scale(.7);opacity:.3}65%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media(max-width:380px){.stats{gap:6px;font-size:12px}.top{gap:7px}.top h2{font-size:18px}}
</style></head><body><div id="app"></div>
<script>
const $=document.getElementById('app'),g=id=>document.getElementById(id);let token=localStorage.t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderRich(value,short=false){
  const original=String(value??'');
  const normalized=original.replace(/\\\[([\s\S]*?)\\\]/g,'$$$$$1$$$$').replace(/\\\(([\s\S]*?)\\\)/g,'$$$$$1$$$$');
  const mathPattern=/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g;
  const latexEnv=/\\begin\{(pmatrix|bmatrix|Bmatrix|vmatrix|Vmatrix|matrix|smallmatrix|cases|aligned|align\*?|array|gathered|split)\}[\s\S]*?\\end\{\1\}/g;
  const wrapBareEnv=text=>text.replace(latexEnv,block=>'$'+block+'$');
  let prepared='',last=0,match;
  while((match=mathPattern.exec(normalized))!==null){
    let outside=wrapBareEnv(normalized.slice(last,match.index));
    if(short&&!outside.includes('$')&&/\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|oint|cdot|times|leq|geq|neq|approx|pi|alpha|beta|theta|infty|pm|div)\b|[\^_]/.test(outside.trim())&&outside.trim()){
      const lead=outside.match(/^\s*/)?.[0]||'',trail=outside.match(/\s*$/)?.[0]||'';
      outside=lead+'$'+outside.trim()+'$'+trail;
    }
    prepared+=outside+match[0];last=match.index+match[0].length;
  }
  let tail=wrapBareEnv(normalized.slice(last));
  if(short&&!tail.includes('$')&&/\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|oint|cdot|times|leq|geq|neq|approx|pi|alpha|beta|theta|infty|pm|div)\b|[\^_]/.test(tail.trim())&&tail.trim()){
    const lead=tail.match(/^\s*/)?.[0]||'',trail=tail.match(/\s*$/)?.[0]||'';
    tail=lead+'$'+tail.trim()+'$'+trail;
  }
  prepared+=tail;
  const formulas=[];
  const tokenized=prepared.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g,(whole,display,inline)=>{
    const formula=display??inline,isDisplay=display!==undefined,token='@@MATH'+formulas.length+'@@';
    formulas.push({token,formula,isDisplay,original:whole});return token;
  });
  let html=short?esc(tokenized):DOMPurify.sanitize(marked.parse(tokenized));
  for(const item of formulas){let rendered;try{rendered=katex.renderToString(item.formula,{displayMode:item.isDisplay,throwOnError:false})}catch{rendered=esc(item.original)}
    if(item.isDisplay)rendered='<div class="math-block">'+rendered+'</div>';
    html=html.split(item.token).join(rendered);
  }
  return html;
}
async function api(p,body,method){
  const r=await fetch('/api'+p,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});
  const d=await r.json();if(r.status===401&&token){logout();}if(!r.ok)throw new Error(d.error);return d;
}
function logout(){localStorage.removeItem('t');token=null;login()}
function statsHTML(me){return `<div class="stats" aria-label="Statistik belajar"><span class="stat stat-flame ${!me.active_today&&me.streak>0?'inactive':''}" title="${me.active_today?'Sudah belajar hari ini':'Belum belajar hari ini'}">🔥 <span>${esc(me.streak)}</span></span><span class="stat" title="Total XP">⭐ <span>${esc(me.xp)}</span></span></div>`;}
function login(reg){
  $.innerHTML=`<div class="card"><h2 class="c">${reg?'Daftar':'Masuk'}</h2><input id="u" placeholder="Username" autocapitalize="none"><input id="p" type="password" placeholder="Password"><button class="btn" id="go">${reg?'DAFTAR':'MASUK'}</button><p class="c link" id="sw">${reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</p></div>`;
  g('sw').onclick=()=>login(!reg);
  g('go').onclick=async()=>{try{const d=await api(reg?'/register':'/login',{username:g('u').value,password:g('p').value});token=d.token;localStorage.t=token;home()}catch(e){alert(e.message)}};
}
async function home(){
  const [cs,me]=await Promise.all([api('/courses'),api('/me')]);
  $.innerHTML=`<div class="top"><h2 style="flex:1">Kamu penasaran tentang apa?</h2>${statsHTML(me)}<span class="link" id="lo">Keluar</span></div>
  <textarea id="pr" rows="2" placeholder="Aku ingin belajar..."></textarea><button class="btn" id="mk">BUAT ROADMAP</button>
  ${cs.map(c=>`<div class="card" data-id="${c.id}" style="cursor:pointer"><b>${esc(c.title)}</b><br><small>${esc(c.done)}/${esc(c.total)} pelajaran</small></div>`).join('')}`;
  g('lo').onclick=logout;
  $.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>course(el.dataset.id));
  g('mk').onclick=async()=>{const p=g('pr').value.trim();if(!p)return;g('mk').disabled=true;g('mk').textContent='Menyusun roadmap...';
    try{const d=await api('/courses',{prompt:p});course(d.id)}catch(e){alert(e.message);home()}};
}
async function course(id){
  const [c,me]=await Promise.all([api('/courses/'+id),api('/me')]);let last=-1,open=c.lessons.findIndex(l=>!l.done),h='';
  c.lessons.forEach((l,i)=>{
    if(l.unit_idx!==last){last=l.unit_idx;h+=`<div class="unit">${esc(Number(l.unit_idx)+1)}. ${esc(l.unit_title)}</div>`}
    const st=l.done?'done':(i===open?'':'lock'),ic=l.done?'✓':(i===open?'▶':'🔒'),off=[0,40,70,40,0][i%5];
    h+=`<div class="node" style="margin-left:${off}px"><button class="dot ${st}" ${st==='lock'?'disabled':''} data-l="${esc(l.id)}">${ic}</button><span>${esc(l.title)}</span></div>`;
  });
  $.innerHTML=`<div class="top"><button class="x" id="bk">←</button><h2 style="flex:1;min-width:0">${esc(c.title)}</h2>${statsHTML(me)}</div>${h}`;
  g('bk').onclick=home;$.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>lesson(b.dataset.l,id));
}
function lesson(id,cid){
  $.innerHTML='<p class="c">Menyiapkan materi, tunggu sebentar...</p>';
  api('/lessons/'+id+'/open',{}).then(async L=>{
    const askHistory=await api('/lessons/'+id+'/ask-history').catch(e=>{console.error(e);return []});
    let askDraft='',askPending=false;
    const originalBodyOverflow=document.body.style.overflow;
    let i=0;
    const quizAnswers={};
    let sheetOpen=false;
    const finish=()=>api('/lessons/'+id+'/complete',{}).then(r=>{
      const details=r.xp_gained>0?`<p>Pelajaran: <b>+${esc(r.xp_lesson_gained)} XP</b></p>${r.xp_perfect_gained>0?`<p>Bonus sempurna: <b>+${esc(r.xp_perfect_gained)} XP</b></p>`:''}`:`<p>Pelajaran ini sudah pernah diselesaikan, tidak ada XP tambahan.</p>`;
      $.innerHTML=`<div class="card c"><h2>Selesai! 🎉</h2><p>Skor kuis: ${esc(r.score)}/${esc(r.total)}</p>${details}<p>XP didapat: <b>+${esc(r.xp_gained)} XP</b></p><p>⭐ Total XP: <b>${esc(r.xp)}</b></p><p>🔥 Streak: <b>${esc(r.streak)} hari</b></p>${r.streak_increased?`<p class="streak-pop">🔥 Streak naik jadi ${esc(r.streak)} hari!</p>`:''}<button class="btn" id="b">KEMBALI</button></div>`;
      g('b').onclick=()=>course(cid);
    }).catch(e=>alert(e.message));
    const catSvg=`<svg viewBox="0 0 120 72" role="img" aria-label="Kucing bingung"><path d="M72 18 Q75 5 86 8 L96 19 Q105 18 111 28 L113 42 Q110 54 94 56 L54 56 Q38 55 33 45 Q28 35 38 29 L50 25 L57 13 Q61 8 66 17 Z" fill="#0d1520"/><path d="M81 17 L86 12 L91 20" fill="#fff"/><path d="M48 33 Q54 28 59 34 M70 33 Q76 28 81 34" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M62 40 Q66 44 70 40" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M38 48 Q25 53 18 47 Q13 43 17 39" fill="none" stroke="#0d1520" stroke-width="7" stroke-linecap="round"/><path d="M52 54 L48 62 M88 55 L91 62" stroke="#0d1520" stroke-width="7" stroke-linecap="round"/><text x="91" y="12" font-size="22" font-weight="900" fill="#a79bf7" stroke="#0d1520" stroke-width=".7">?</text></svg>`;
    const catShake=()=>{const c=g('cat-help');if(!c)return;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')};
    const scrollAskBottom=()=>{const list=document.querySelector('#ask-overlay .ask-messages');if(list)list.scrollTop=list.scrollHeight};
    const addAskMessage=(m)=>{
      const overlay=document.getElementById('ask-overlay'),list=overlay?.querySelector('.ask-messages');if(!list)return null;
      const row=document.createElement('div');row.className='ask-message '+(m.role==='user'?'user':'assistant');row.dataset.blockIdx=String(m.block_idx);
      const label=document.createElement('div');label.className='ask-label';label.textContent='Blok '+(Number(m.block_idx)+1);row.appendChild(label);
      const body=document.createElement('div');body.className='ask-message-body';
      body.innerHTML=m.role==='user'?esc(m.content||''):renderRich(m.content||'');
      row.appendChild(body);list.appendChild(row);scrollAskBottom();return row;
    };
    const renderAskHistory=()=>{const list=document.querySelector('#ask-overlay .ask-messages');if(!list)return;list.replaceChildren();askHistory.forEach(m=>addAskMessage(m));scrollAskBottom()};
    const closeSheet=()=>{
      const o=document.getElementById('ask-overlay');if(!o)return;
      const input=o.querySelector('#ask-question');if(input)askDraft=input.value;
      sheetOpen=false;o.remove();document.body.style.overflow=originalBodyOverflow;
      if(window.visualViewport)window.visualViewport.removeEventListener('resize',resizeAskSheet);
    };
    const resizeAskSheet=()=>{const o=document.getElementById('ask-overlay');if(!o||!window.visualViewport)return;o.style.height=window.visualViewport.height+'px'};
    const openSheet=()=>{
      if(document.getElementById('ask-overlay'))return;
      sheetOpen=true;document.body.style.overflow='hidden';
      const overlay=document.createElement('div');overlay.className='ask-overlay';overlay.id='ask-overlay';overlay.setAttribute('role','presentation');
      overlay.innerHTML='<section class="ask-sheet" role="dialog" aria-modal="true" aria-labelledby="ask-title"><div class="ask-head"><h3 id="ask-title">Bingung bagian mana?</h3><button class="ask-clear" id="ask-clear">Hapus riwayat</button><button class="ask-close" id="ask-close" aria-label="Tutup">×</button></div><p class="ask-subtitle">Tanya tentang bagian pelajaran ini.</p><div class="ask-messages" id="ask-messages" aria-live="polite"></div><form class="ask-composer" id="ask-form"><textarea id="ask-question" maxlength="300" rows="1" placeholder="Tulis pertanyaanmu..."></textarea><button class="btn ask-send" id="ask-send" type="submit">TANYA</button></form></section>';
      document.body.appendChild(overlay);
      const sheet=overlay.querySelector('.ask-sheet');
      sheet.addEventListener('click',e=>e.stopPropagation());
      overlay.addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()});
      overlay.querySelector('#ask-close').addEventListener('click',closeSheet);
      const input=overlay.querySelector('#ask-question'),send=overlay.querySelector('#ask-send'),form=overlay.querySelector('#ask-form');
      input.value=askDraft;renderAskHistory();
      if(window.visualViewport){resizeAskSheet();window.visualViewport.addEventListener('resize',resizeAskSheet)}
      input.addEventListener('input',()=>{askDraft=input.value;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,112)+'px'});
      overlay.querySelector('#ask-clear').addEventListener('click',async()=>{
        if(!confirm('Hapus semua riwayat tanya kucing untuk pelajaran ini?'))return;
        try{await api('/lessons/'+id+'/ask-history',null,'DELETE');askHistory.splice(0,askHistory.length);overlay.querySelector('#ask-messages').replaceChildren()}
        catch(e){alert('Riwayat gagal dihapus. Coba lagi ya.')}
      });
      const sendQuestion=async(question,rowToUpdate=null,blockIdx=i)=>{
        if(askPending)return;
        question=String(question||'').trim();if(!question)return;
        askPending=true;send.disabled=true;send.textContent='...';input.disabled=true;
        if(!rowToUpdate){
          const entry={role:'user',block_idx:blockIdx,content:question};
          askHistory.push(entry);rowToUpdate=addAskMessage(entry);
        }
        input.value='';askDraft='';input.style.height='46px';
        const pending=document.createElement('div');pending.className='ask-message assistant';pending.dataset.pending='true';
        pending.innerHTML='<div class="ask-label">Blok '+(Number(rowToUpdate.dataset.blockIdx)+1)+'</div><div class="ask-message-body ask-thinking">Sedang berpikir...</div>';
        rowToUpdate.after(pending);scrollAskBottom();
        try{
          const r=await api('/lessons/'+id+'/ask',{block_idx:Number(rowToUpdate.dataset.blockIdx),question});
          const answer=String(r.answer||'').trim();pending.remove();
          const entry={role:'assistant',block_idx:Number(rowToUpdate.dataset.blockIdx),content:answer};
          askHistory.push(entry);addAskMessage(entry);
        }catch(e){
          pending.classList.add('error');pending.querySelector('.ask-message-body').className='ask-message-body';pending.querySelector('.ask-message-body').textContent='Gagal menjawab, coba lagi';
          const retry=document.createElement('button');retry.type='button';retry.className='ask-retry';retry.textContent='Coba lagi';
          retry.addEventListener('click',()=>{pending.remove();sendQuestion(question,rowToUpdate,Number(rowToUpdate.dataset.blockIdx))});pending.appendChild(retry);scrollAskBottom();
        }finally{askPending=false;send.disabled=false;send.textContent='TANYA';input.disabled=false}
      };
      form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q)sendQuestion(q,null,i)});
      input.focus();
    };
    const show=()=>{
      if(i>=L.blocks.length)return finish();
      const b=L.blocks[i],saved=quizAnswers[i];
      const dots=L.blocks.map((_,n)=>`<span class="lesson-dot ${n===i?'active':''}" aria-label="Blok ${n+1}"></span>`).join('');
      $.innerHTML=`<div class="top"><button class="x" id="x" aria-label="Keluar pelajaran">✕</button><b style="flex:1;text-align:center;font-size:14px">PELAJARAN</b><span style="width:28px"></span></div><div class="lesson-dots" aria-label="Progres pelajaran">${dots}</div><div class="card" id="bd"></div><div id="fb"></div><div class="spacer" aria-hidden="true"></div><button class="cat-bubble" id="cat-help" aria-label="Tanya tutor AI">${catSvg}</button><div class="lesson-nav"><button class="btn sec lesson-prev" id="prev" aria-label="Blok sebelumnya" ${i===0?'disabled':''}>&lt;</button><button class="btn lesson-next" id="nx" ${b.type==='quiz'&&!saved?'style="display:none"':''}>LANJUT &gt;</button></div>`;
      g('x').onclick=()=>course(cid);
      g('prev').onclick=()=>{if(i>0){i--;show()}};
      g('nx').onclick=()=>{i++;show()};
      g('cat-help').onclick=openSheet;
      if(b.type==='text'){
        g('bd').innerHTML=renderRich(b.markdown||'');
      }else{
        g('bd').innerHTML=`<h3>${renderRich(b.question,true)}</h3>`+(b.options||[]).map((o,k)=>`<button class="opt" data-k="${k}">${renderRich(o,true)}</button>`).join('');
        if(saved){
          g('bd').querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j===saved.correct)o.classList.add('ok');else if(j===saved.chosen&&!saved.is_correct)o.classList.add('no')});
          g('fb').innerHTML=`<p class="fb" id="feedback-text">${saved.is_correct?'✅ Benar!':'❌ Kurang tepat.'} ${renderRich(saved.explanation||'',true)}</p>`;
        }else{
          g('bd').querySelectorAll('.opt').forEach(el=>el.onclick=async()=>{
            if(quizAnswers[i])return;
            const k=+el.dataset.k;g('bd').querySelectorAll('.opt').forEach(o=>o.disabled=true);
            try{
              const r=await api('/lessons/'+id+'/answer',{quiz_idx:i,chosen:k});
              quizAnswers[i]={chosen:k,correct:r.correct,is_correct:!!r.is_correct,explanation:r.explanation||''};
              g('bd').querySelectorAll('.opt').forEach((o,j)=>{if(j===r.correct)o.classList.add('ok');else if(j===k)o.classList.add('no')});
              g('fb').innerHTML=`<p class="fb" id="feedback-text">${r.is_correct?'✅ Benar!':'❌ Kurang tepat.'} ${renderRich(r.explanation||'',true)} ${Number(r.xp_gained)>0?`<span class="xp-pop">+${esc(r.xp_gained)} XP</span>`:''}</p>`;
              g('nx').style.display='block';
              if(!r.is_correct)catShake();
              g('fb').scrollIntoView({behavior:'smooth',block:'center'});
            }catch(e){g('bd').querySelectorAll('.opt').forEach(o=>o.disabled=false);alert(e.message||'Jawaban gagal dikirim. Coba lagi ya.')}
          });
        }
      }
    };
    show();
  }).catch(e=>{alert(e.message);course(cid)});
}
token?home().catch(login):login();
