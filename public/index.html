<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== LANGKAH 1: Design tokens ===== */
:root{--bg:#131f24;--card:#1f2c34;--border:#37464f;--border-d:#2b3841;--text:#ffffff;--muted:#afafaf;
--green:#58cc02;--green-d:#58a700;--gold:#ffc800;--gold-d:#e5a800;--blue:#1cb0f6;--blue-d:#1899d6;
--red:#ff4b4b;--red-d:#ea2b2b;--orange:#ff9600;--purple:#a79bf7;--cat-body:#ffffff;--cat-face:#131f24}
:root[data-theme="light"]{--bg:#ffffff;--card:#f7f7f7;--border:#e5e5e5;--border-d:#cfcfcf;--text:#3c3c3c;--muted:#777777;--cat-body:#0d1520;--cat-face:#ffffff}
*{box-sizing:border-box;min-width:0}
html{max-width:100%;overflow-x:hidden}
body{margin:0;width:100%;max-width:520px;margin-left:auto;margin-right:auto;overflow-x:clip;background:var(--bg);color:var(--text);
font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;min-height:100vh;min-height:100dvh}
@supports(height:100dvh){body{min-height:100dvh}}
#app{width:100%;max-width:100%;min-width:0;padding:0 16px}
body.nav-on #app{padding-bottom:calc(94px + env(safe-area-inset-bottom))}
.c{text-align:center}.muted{color:var(--muted)}
h1,h2,h3{color:var(--text)}
/* Komponen dasar */
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:16px;margin:12px 0;max-width:100%;min-width:0;overflow-wrap:anywhere}
.btn{--btn-d:var(--green-d);display:block;width:100%;padding:14px;border:0;border-radius:16px;background:var(--green);color:#fff;
font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin:10px 0;cursor:pointer;
box-shadow:0 5px 0 var(--btn-d);transition:transform .06s,box-shadow .06s;-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--btn-d)}
.btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.btn-blue{--btn-d:var(--blue-d);background:var(--blue)}
.btn-gold{--btn-d:var(--gold-d);background:var(--gold)}
.btn-red{--btn-d:var(--red-d);background:var(--red)}
.btn-ghost{--btn-d:var(--border);background:transparent;color:var(--text);border:2px solid var(--border);box-shadow:0 4px 0 var(--border)}
.btn-ghost:active:not(:disabled){box-shadow:0 1px 0 var(--border)}
input,textarea{width:100%;padding:12px;border:2px solid var(--border);border-radius:14px;font-size:16px;font-family:inherit;font-weight:600;margin:6px 0;background:var(--card);color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--blue)}
input::placeholder,textarea::placeholder{color:var(--muted)}
.link{color:var(--blue);text-decoration:underline;cursor:pointer;font-weight:700;background:none;border:0;font-family:inherit;font-size:inherit;padding:0}
.page-title{font-size:26px;font-weight:900;margin:18px 0 10px}
/* Opsi kuis */
.opt{display:block;width:100%;max-width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);
font-family:inherit;font-size:16px;font-weight:600;text-align:left;margin:10px 0;box-shadow:0 4px 0 var(--border);min-height:56px;white-space:normal;
overflow-wrap:anywhere;word-break:break-word;line-height:1.5;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--border)}
.opt:disabled{cursor:default}
.opt .katex{font-size:1em;white-space:normal;max-width:100%;width:auto;min-width:0}
.opt .katex-html{white-space:normal;max-width:100%}
.opt .katex-display{max-width:100%;overflow-x:auto;font-size:.9em}
.opt.ok{background:rgba(88,204,2,.18)!important;border-color:var(--green)!important}
.opt.no{background:rgba(255,75,75,.14)!important;border-color:var(--red)!important}
/* KaTeX & materi mengikuti tema */
.katex{color:var(--text)}
.math-block{overflow-x:auto;max-width:100%;min-width:0;text-align:center;margin:12px 0;font-size:.95em}
.katex{font-size:1.1em}
/* ===== LANGKAH 3: Bottom nav ===== */
#nav{position:fixed;z-index:35;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:none;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--border)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid transparent;border-radius:14px;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.active{background:var(--card);border-color:var(--blue);color:var(--blue)}
/* Kartu kursus */
.pbar-track{height:14px;border-radius:99px;background:var(--border);overflow:hidden;margin:10px 0 6px}
.pbar-track i{display:block;height:100%;background:var(--green);border-radius:99px;box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
/* ===== LANGKAH 2: Roadmap ===== */
.statusbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;background:var(--bg);margin:0 -16px;padding:10px 16px;min-height:60px}
.sb-sp{flex:1}
.sb-stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:16px}
.sb-stat svg{width:26px;height:26px}
.sb-flame{color:var(--orange)}
.sb-flame.off{color:var(--muted)}
.sb-flame.off svg{color:var(--border)}
.sb-xp{color:var(--gold)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.unit-banner{position:sticky;top:60px;z-index:25;background:var(--green);border:0;border-bottom:5px solid var(--green-d);border-radius:16px;color:#fff;padding:12px 16px;margin:10px 0 18px}
.unit-banner small{display:block;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.92}
.unit-banner b{display:block;font-size:20px;font-weight:900;line-height:1.25}
.crs-title{margin:14px 0 2px;font-size:24px}
.path{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.node-wrap{position:relative;width:76px;height:76px;margin-bottom:28px;flex:none}
.node-btn{width:76px;height:76px;border-radius:50%;border:0;background:var(--green);--nd:var(--green-d);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 var(--nd);-webkit-tap-highlight-color:transparent}
.node-btn svg{width:34px;height:34px}
.node-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 4px 0 var(--nd)}
.node-btn.done{background:var(--gold);--nd:var(--gold-d)}
.node-btn.lock{background:var(--border);--nd:var(--border-d);cursor:default}
.node-btn.lock svg{opacity:.85}
.node-stars{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);display:flex;gap:2px}
.node-stars svg{width:15px;height:15px}
.node-stars .on{color:var(--gold)}
.node-stars .off{color:var(--border)}
.bubble-start{position:absolute;bottom:calc(100% + 12px);left:50%;background:#fff;color:#3c3c3c;border:2px solid var(--border);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:900;letter-spacing:.8px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.bubble-start::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%) rotate(45deg);margin-top:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--border);border-bottom:2px solid var(--border)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.node-cat{position:absolute;top:50%;width:86px;transform:translateY(-50%);pointer-events:none}
.node-cat.left{right:calc(100% + 10px)}
.node-cat.right{left:calc(100% + 10px)}
.node-cat svg{width:100%;height:auto;color:var(--cat-body)}
.jump{position:fixed;z-index:28;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(94px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--card);border:2px solid var(--border);color:var(--text);box-shadow:0 4px 0 var(--border);display:none;align-items:center;justify-content:center;cursor:pointer}
.jump svg{width:24px;height:24px}
.jump:active{transform:translateY(2px);box-shadow:0 2px 0 var(--border)}
/* ===== LANGKAH 4: Layar pelajaran ===== */
.l-head{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;background:var(--bg);margin:0 -16px;padding:12px 16px}
.pbar{flex:1;height:16px;border-radius:9px;background:var(--border);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;box-shadow:inset 0 3px 0 rgba(255,255,255,.25);transition:width .3s ease}
#bd{padding:6px 2px;font-size:18px;line-height:1.6;overflow-wrap:anywhere;max-width:100%;min-width:0}
#bd h3{font-size:22px;font-weight:800;margin:6px 0 12px;line-height:1.35}
#bd h1,#bd h2{font-weight:900;line-height:1.3}
#bd p{margin:10px 0}
#bd ul,#bd ol{padding-left:22px}
#bd table,.ask-message table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto;margin:10px 0}
#bd th,#bd td,.ask-message th,.ask-message td{border:1px solid var(--border);padding:6px 10px}
#bd code,.ask-message code{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1px 5px;font-size:.9em}
#bd pre{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px;overflow-x:auto;max-width:100%}
#bd pre code{background:none;border:0;padding:0}
#bd blockquote{border-left:4px solid var(--blue);margin:10px 0;padding:2px 12px;color:var(--muted)}
#bd img{max-width:100%}
#bd .katex,#fb .katex,.ask-answer .katex{max-width:100%}
#bd .katex-display,#fb .katex-display,.ask-answer .katex-display{max-width:100%;overflow-x:auto;font-size:.9em}
#bd p,#bd li,#fb p,#fb li,.ask-answer p,.ask-answer li{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
#bd,#fb{box-sizing:border-box;max-width:100%;min-width:0;overflow-wrap:anywhere}
#fb{margin-top:14px;border-radius:16px;overflow-wrap:anywhere}
#fb:empty{display:none}
#fb.good{background:rgba(88,204,2,.15);border:2px solid var(--green);padding:13px 16px;animation:slideUp .25s ease both}
#fb.bad{background:rgba(255,75,75,.12);border:2px solid var(--red);padding:13px 16px;animation:slideUp .25s ease both}
#fb .fb-t{font-weight:900}
#fb.good .fb-t{color:var(--green)}
#fb.bad .fb-t{color:var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lesson-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.lesson-nav button{margin:0;height:52px}
.lesson-prev{width:58px;flex:0 0 58px;padding:8px!important;display:flex;align-items:center;justify-content:center}
.lesson-prev svg{width:22px;height:22px}
.lesson-next{flex:1}
.lesson-nav button:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.spacer{height:180px;pointer-events:none;flex-shrink:0;display:block}
.xp-pop{display:inline-block;margin-left:8px;color:var(--gold);font-size:13px;font-weight:800;animation:xpPop 1.2s ease-out both}
@keyframes xpPop{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(-5px)}100%{opacity:0;transform:translateY(-13px)}}
.streak-pop{display:inline-block;animation:streakPop .6s ease-out}
@keyframes streakPop{0%{transform:scale(.7);opacity:.3}65%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* Tutor kucing */
.cat-bubble{position:fixed;z-index:21;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(96px + env(safe-area-inset-bottom));width:110px;height:70px;padding:4px;border:2px solid var(--border);border-radius:15px;background:var(--card);box-shadow:0 3px 0 var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:catWiggle 4s ease-in-out infinite;transform-origin:75% 100%}
.cat-bubble svg{width:100%;height:100%;color:var(--cat-body)}
@keyframes catWiggle{0%,88%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}92%{transform:rotate(4deg)}94%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}98%{transform:rotate(0)}}
.cat-bubble.shake{animation:catNudge .42s ease-in-out}
@keyframes catNudge{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
/* Sheet tanya kucing */
.ask-overlay{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.ask-sheet{width:min(100%,520px);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:2px solid var(--border);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 0 rgba(0,0,0,.3);min-height:0}
@supports(height:100dvh){.ask-sheet{max-height:85dvh}}
.ask-head{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-bottom:10px;border-bottom:2px solid var(--border)}
.ask-head h3{flex:1;margin:0;font-size:18px}
.ask-close{border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:22px;width:40px;height:40px;flex-shrink:0;cursor:pointer}
.ask-clear{border:2px solid var(--border);background:transparent;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;color:var(--blue);font-family:inherit;cursor:pointer}
.ask-subtitle{margin:8px 0;color:var(--muted);font-size:12px;flex-shrink:0}
.ask-messages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 2px 12px;display:flex;flex-direction:column;gap:12px}
.ask-message{max-width:88%;min-width:0;border:2px solid var(--border);border-radius:15px;padding:9px 11px;overflow-wrap:anywhere;word-break:break-word;line-height:1.5;flex-shrink:0;background:var(--card)}
.ask-message.user{align-self:flex-end;background:var(--blue);border-color:var(--blue);color:#fff;border-bottom-right-radius:5px}
.ask-message.assistant{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.ask-message.error{border-color:var(--red);color:var(--red)}
.ask-label{font-size:10px;font-weight:800;letter-spacing:.02em;opacity:.72;margin-bottom:4px}
.ask-message p{margin:5px 0}.ask-message p:first-child{margin-top:0}.ask-message p:last-child{margin-bottom:0}
.ask-message .katex{max-width:100%}
.ask-message .katex-display,.ask-message .math-block{max-width:100%;overflow-x:auto;font-size:.9em}
.ask-composer{display:flex;gap:8px;align-items:flex-end;flex-shrink:0;padding-top:10px;border-top:2px solid var(--border);background:var(--card)}
.ask-composer textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:112px;margin:0;padding:10px;border:2px solid var(--border);border-radius:12px;font-size:16px;line-height:1.4;overflow-y:auto;background:var(--bg);color:var(--text)}
.ask-send{width:auto;min-width:84px;margin:0;padding:12px 10px;align-self:stretch}
.ask-send:disabled{opacity:.55}
.ask-thinking{opacity:.7;font-style:italic}
.ask-retry{margin-top:7px;border:1px solid var(--red);background:transparent;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;color:var(--red);font-family:inherit;cursor:pointer}
/* ===== LANGKAH 5: Selesai, profil, auth ===== */
.fin{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 0}
.fin-cat svg{width:200px;height:auto;color:var(--cat-body)}
.fin h1{font-size:30px;font-weight:900;margin:14px 0 22px}
.fin-stats{display:flex;gap:12px;width:100%;max-width:360px;margin-bottom:16px}
.fstat{flex:1;border:2px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card)}
.fstat-h{padding:6px 4px;font-size:12px;font-weight:900;letter-spacing:1px;color:#fff;text-transform:uppercase}
.fstat-h.gold{background:var(--gold)}.fstat-h.green{background:var(--green)}.fstat-h.orange{background:var(--orange)}
.fstat-v{padding:12px 6px;font-size:22px;font-weight:900}
.fin-note{color:var(--muted);margin:4px 0}
.fin-btn{max-width:360px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;opacity:0;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.auth-cat{align-self:center}
.auth-cat svg{width:180px;height:auto;color:var(--cat-body)}
.auth-title{text-align:center;font-size:28px;font-weight:900;margin:10px 0 18px}
.prof-head{display:flex;align-items:center;gap:14px}
.prof-head svg{width:96px;height:auto;flex:none;color:var(--cat-body)}
.prof-head h2{margin:0;font-size:22px;font-weight:900}
.prof-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:2px solid var(--border)}
.prof-row:last-child{border-bottom:0}
.prof-l{display:inline-flex;align-items:center;gap:8px}
.prof-l svg{width:20px;height:20px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg-b{flex:1;padding:10px;border:2px solid var(--border);border-radius:12px;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.seg-b.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.12)}
@media(max-width:380px){.sb-stat{font-size:14px;gap:3px}.statusbar{gap:9px}.unit-banner b{font-size:18px}#bd{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.learn-back{display:flex;align-items:center;gap:8px;margin:10px 0 22px;padding:9px 14px;min-height:42px;font-size:14px}
#cat-loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,18,22,.94);color:#fff;font-size:17px}
.cat-loader{font-size:64px;animation:cat-hop .62s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes cat-hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-34px) rotate(8deg)}}
</style></head><body>
<div id="app"></div>
<nav id="nav" aria-label="Navigasi utama">
<button class="tab" data-tab="learn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6 21.5 10.5V21a1 1 0 0 1-1 1h-5.6v-6.5h-5.8V22H3.5a1 1 0 0 1-1-1V10.5z"/></svg><span>Belajar</span></button>
<button class="tab" data-tab="create"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg><span>Buat</span></button>
<button class="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 8 2.2 8 5v2H4v-2c0-2.8 3.6-5 8-5z"/></svg><span>Profil</span></button>
</nav>
<script>
const $=document.getElementById('app'),g=id=>document.getElementById(id);
const navEl=document.getElementById('nav');
let token=localStorage.t;

function renderRich(value,short=false){
  const original=String(value??'');
  const normalized=original.replace(/\\\[([\s\S]*?)\\\]/g,'$$$$$1$$$$').replace(/\\\(([\s\S]*?)\\\)/g,'$$$$$1$$$$');
  const mathPattern=/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g;
  const latexEnv=/\\begin\{(pmatrix|bmatrix|Bmatrix|vmatrix|Vmatrix|matrix|smallmatrix|cases|aligned|align\*?|array|gathered|split)\}[\s\S]*?\\end\{\1\}/g;
  const wrapBareEnv=text=>text.replace(latexEnv,block=>'$'+block+'$');
  let prepared='',last=0,match;
  while((match=mathPattern.exec(normalized))!==null){
    let outside=wrapBareEnv(normalized.slice(last,match.index));
    if(short&&!outside.includes('$')&&/\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|oint|cdot|times|leq|geq|neq|approx|pi|alpha|beta|theta|infty|pm|div)\b|[\^_]/.test(outside.trim())&&outside.trim()){
      const lead=outside.match(/^\s*/)?.[0]||'',trail=outside.match(/\s*$/)?.[0]||'';
      outside=lead+'$'+outside.trim()+'$'+trail;
    }
    prepared+=outside+match[0];last=match.index+match[0].length;
  }
  let tail=wrapBareEnv(normalized.slice(last));
  if(short&&!tail.includes('$')&&/\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|oint|cdot|times|leq|geq|neq|approx|pi|alpha|beta|theta|infty|pm|div)\b|[\^_]/.test(tail.trim())&&tail.trim()){
    const lead=tail.match(/^\s*/)?.[0]||'',trail=tail.match(/\s*$/)?.[0]||'';
    tail=lead+'$'+tail.trim()+'$'+trail;
  }
  prepared+=tail;
  const formulas=[];
  const tokenized=prepared.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g,(whole,display,inline)=>{
    const formula=display??inline,isDisplay=display!==undefined,token='@@MATH'+formulas.length+'@@';
    formulas.push({token,formula,isDisplay,original:whole});return token;
  });
  let html=short?esc(tokenized):DOMPurify.sanitize(marked.parse(tokenized));
  for(const item of formulas){let rendered;try{rendered=katex.renderToString(item.formula,{displayMode:item.isDisplay,throwOnError:false})}catch{rendered=esc(item.original)}
    if(item.isDisplay)rendered='<div class="math-block">'+rendered+'</div>';
    html=html.split(item.token).join(rendered);
  }
  return html;
}

}

  const wrap=document.createElement('div');wrap.className='confetti';wrap.setAttribute('aria-hidden','true');
  for(let n=0;n<20;n++){const s=document.createElement('i');s.style.left=(Math.random()*96)+'%';s.style.background=colors[n%colors.length];s.style.animationDelay=(Math.random()*.8)+'s';s.style.animationDuration=(2.2+Math.random()*1.5)+'s';wrap.appendChild(s)}

async function course(id){
  setNav('learn');
  const [c,me]=await Promise.all([api('/courses/'+id),api('/me')]);
  if(!c.lessons.length){$.innerHTML=`<div class="statusbar"><button class="icon-btn" id="bk" aria-label="Kembali">${IC.back}</button></div><p class="muted c" style="margin-top:40px">Belum ada pelajaran.</p>`;g('bk').onclick=learn;return}
  const open=c.lessons.findIndex(l=>!l.done);
  const offs=[0,-40,-64,-40,0,40,64,40];
  let last=null,secs=[];
  c.lessons.forEach((l,i)=>{
    const u=Number(l.unit_idx);
    if(last===null||u!==last){last=u;secs.push({n:u+1,t:l.unit_title,nodes:''})}
    const s=secs[secs.length-1];
    const isLastOfUnit=(i===c.lessons.length-1)||(Number(c.lessons[i+1].unit_idx)!==u);
    const st=l.done?'done':(i===open?'active':'lock');
    const off=offs[i%8];
    const sc=Number(l.score||0),qt=Number(l.quiz_total||0);
    let stars='';
    if(l.done){
      const n=qt>0?(sc>=qt?3:(sc/qt>=0.6?2:1)):3;
      stars='<span class="node-stars">'+[0,1,2].map(k=>starSvg(k<n?'on':'off')).join('')+'</span>';
    }
    const ic=isLastOfUnit?IC.trophy:(st==='done'?IC.check:(st==='active'?IC.play:IC.lock));
    const catSide=off>0?'left':'right';
    s.nodes+=`<div class="node-wrap" style="transform:translateX(${off}px)">
      ${i===open?'<span class="bubble-start">MULAI</span>':''}
      <button class="node-btn ${st}" ${st==='lock'?'disabled':''} data-l="${esc(l.id)}" aria-label="${esc(l.title)}">${ic}</button>
      ${stars}
      ${i===open?`<span class="node-cat ${catSide}">${catSvg}</span>`:''}
    </div>`;
  });
  $.innerHTML=`<div class="statusbar">
    <button class="icon-btn" id="bk" aria-label="Kembali">${IC.back}</button>
    <span class="sb-sp"></span>
    <span class="sb-stat sb-flame ${!me.active_today&&me.streak>0?'off':''}" title="${me.active_today?'Sudah belajar hari ini':'Belum belajar hari ini'}">${IC.flame}<span>${esc(me.streak)}</span></span>
    <span class="sb-stat sb-xp" title="Total XP">${IC.star}<span>${esc(me.xp)}</span></span>
  </div>
  <div class="unit-banner"><small id="ub-n">UNIT ${esc(secs[0].n)}</small><b id="ub-t">${esc(secs[0].t)}</b></div>
  <h1 class="page-title crs-title">${esc(c.title)}</h1>
  ${secs.map(s=>`<section class="unit-sec" data-n="${esc(s.n)}" data-t="${esc(s.t)}"><div class="path">${s.nodes}</div></section>`).join('')}
  <button class="jump" id="jump" aria-label="Ke pelajaran aktif">${IC.down}</button>`;
  g('bk').onclick=learn;
  $.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>lesson(b.dataset.l,id));
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){g('ub-n').textContent='UNIT '+e.target.dataset.n;g('ub-t').textContent=e.target.dataset.t}});
  },{rootMargin:'-64px 0px -55% 0px'});
  $.querySelectorAll('.unit-sec').forEach(s=>io.observe(s));
  const act=$.querySelector('.node-btn.active'),jump=g('jump');
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const toAct=()=>act&&act.scrollIntoView({behavior:rm?'auto':'smooth',block:'center'});
  if(act){
    setTimeout(toAct,120);
    const upd=()=>{if(!act.isConnected||!jump.isConnected){removeEventListener('scroll',upd);return}
      const r=act.getBoundingClientRect();
      jump.style.display=(r.top>70&&r.bottom<innerHeight-100)?'none':'flex'};
    addEventListener('scroll',upd,{passive:true});setTimeout(upd,150);
    jump.onclick=toAct;
  }else jump.style.display='none';
}

          const retry=document.createElement('button');retry.type='button';retry.className='ask-retry';retry.textContent='Coba lagi';
          retry.addEventListener('click',()=>{pending.remove();sendQuestion(question,rowToUpdate,Number(rowToUpdate.dataset.blockIdx))});pending.appendChild(retry);scrollAskBottom();
        }finally{askPending=false;send.disabled=false;send.textContent='TANYA';input.disabled=false}
      };
      form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q)sendQuestion(q,null,i)});
      input.focus();
    };
    const show=()=>{
      if(i>=L.blocks.length)return finish();
      const b=L.blocks[i],saved=quizAnswers[i];
      const pct=Math.round(((i+1)/L.blocks.length)*100);
      $.innerHTML=`<div class="l-head"><button class="icon-btn" id="x" aria-label="Keluar pelajaran">${IC.x}</button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i id="pfill"></i></div></div><div id="bd" class="material"></div><div id="fb"></div><div class="spacer" aria-hidden="true"></div><button class="cat-bubble" id="cat-help" aria-label="Tanya tutor AI">${catSvg}</button><div class="lesson-nav"><button class="btn btn-ghost lesson-prev" id="prev" aria-label="Blok sebelumnya" ${i===0?'disabled':''}>${IC.back}</button><button class="btn btn-green lesson-next" id="nx" ${b.type==='quiz'&&!saved?'style="display:none"':''}>LANJUT</button></div>`;
      const pf=g('pfill');pf.style.width=prevPct+'%';requestAnimationFrame(()=>{pf.style.width=pct+'%'});prevPct=pct;
      g('x').onclick=()=>course(cid);
      g('prev').onclick=()=>{if(i>0){i--;show()}};
      g('nx').onclick=()=>{i++;show()};
      g('cat-help').onclick=openSheet;
      if(b.type==='text'){
        g('bd').innerHTML=renderRich(b.markdown||'');
      }else{
        g('bd').innerHTML=`<h3>${renderRich(b.question,true)}</h3>`+(b.options||[]).map((o,k)=>`<button class="opt" data-k="${k}">${renderRich(o,true)}</button>`).join('');
        if(saved){
          g('bd').querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j===saved.correct)o.classList.add('ok');else if(j===saved.chosen&&!saved.is_correct)o.classList.add('no')});
          g('fb').className=saved.is_correct?'good':'bad';
          g('fb').innerHTML=`<b class="fb-t">${saved.is_correct?'Benar!':'Kurang tepat.'}</b> ${renderRich(saved.explanation||'',true)}`;
          if(!saved.is_correct)g('nx').classList.add('btn-red');
        }else{
          g('bd').querySelectorAll('.opt').forEach(el=>el.onclick=async()=>{
            if(quizAnswers[i])return;
            const k=+el.dataset.k, options=g('bd').querySelectorAll('.opt'), feedback=g('fb');
            options.forEach(o=>{o.disabled=true;o.classList.toggle('selected-pending',o===el)});
            feedback.className='pending';
            feedback.textContent='Memeriksa jawaban…';
            g('nx').style.display='none';
            try{
              const r=await api('/lessons/'+id+'/answer',{quiz_idx:i,chosen:k});
              quizAnswers[i]={chosen:k,correct:r.correct,is_correct:!!r.is_correct,explanation:r.explanation||''};
              options.forEach((o,j)=>{o.classList.remove('selected-pending');if(j===r.correct)o.classList.add('ok');else if(j===k)o.classList.add('no')});
              feedback.className=r.is_correct?'good':'bad';
              feedback.innerHTML=`<b class="fb-t">${r.is_correct?'Benar!':'Kurang tepat.'}</b> ${renderRich(r.explanation||'',true)} ${Number(r.xp_gained)>0?`<span class="xp-pop">+${esc(r.xp_gained)} XP</span>`:''}`;
              g('nx').style.display='block';
              if(r.is_correct){g('nx').classList.remove('btn-red');try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}}
              else{g('nx').classList.add('btn-red');try{navigator.vibrate&&navigator.vibrate([40,40,40])}catch(_){}}
              if(!r.is_correct)catShake();
              feedback.scrollIntoView({behavior:'smooth',block:'center'});
            }catch(e){
              options.forEach(o=>{o.disabled=false;o.classList.remove('selected-pending')});
              feedback.className='bad';
              feedback.textContent=e.message||'Jawaban gagal dikirim. Coba lagi ya.';
            }
          });        }
      }
    };
    show();
  }).catch(e=>{alert(e.message);course(cid)});
}
token?learn().catch(login):login();
